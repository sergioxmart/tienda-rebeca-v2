<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TechStore Colombia — accesorios para tu celular" />
    <meta name="theme-color" content="#0F2A47" />
    <title>TechStore</title>
    <script>
      // Inyecta el title desde /api/public/site-config antes de que
      // React monte, para que la pestaña del browser muestre el nombre
      // real. Si falla, queda el "TechStore" del <title> de arriba.
      (async () => {
        try {
          const r = await fetch('/api/public/site-config');
          if (!r.ok) return;
          const data = await r.json();
          const name = data?.config?.site_name;
          if (name) document.title = name;
        } catch { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
